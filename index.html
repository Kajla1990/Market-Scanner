<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kajla1990 Terminal - Market Scanner</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }
        .header {
            background-color: #181A21;
            padding: 12px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #333;
        }
        .header-title {
            color: #2979FF;
            font-weight: bold;
            font-size: 16px;
        }
        .header-balance {
            color: #00E676;
            font-size: 14px;
        }
        .chart-container {
            flex: 1;
            width: 100%;
            position: relative;
            background-color: #121212;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        .footer {
            background-color: #181A21;
            padding: 10px;
            display: flex;
            justify-content: space-around;
            border-top: 1px solid #333;
        }
        .footer-item {
            color: #888;
            font-size: 12px;
            text-align: center;
        }
        .footer-item.active {
            color: #2979FF;
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="header-title">kajla1990 🇮🇳 Terminal</div>
        <div class="header-balance">Demo: ₹4,98,000</div>
    </div>

    <div class="chart-container" id="chartBox">
        <canvas id="niftyCanvas"></canvas>
    </div>

    <div class="footer">
        <div class="footer-item active">Chart & Ind</div>
        <div class="footer-item">Strategy</div>
        <div class="footer-item">Paper Trade</div>
        <div class="footer-item">Portfolio</div>
    </div>

    <script>
        const canvas = document.getElementById('niftyCanvas');
        const ctx = canvas.getContext('2d');
        const box = document.getElementById('chartBox');

        function resizeCanvas() {
            canvas.width = box.clientWidth;
            canvas.height = box.clientHeight;
            drawChart();
        }

        window.addEventListener('resize', resizeCanvas);

        function drawChart() {
            ctx.fillStyle = '#121212';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            //Grid lines
            ctx.strokeStyle = '#222222';
            ctx.lineWidth = 1;
            for(let i = 0; i < canvas.width; i += 40) {
                ctx.beginPath();
                ctx.moveTo(i, 0);
                ctx.lineTo(i, canvas.height);
                ctx.stroke();
            }
            for(let j = 0; j < canvas.height; j += 40) {
                ctx.beginPath();
                ctx.moveTo(0, j);
                ctx.lineTo(canvas.width, j);
                ctx.stroke();
            }

            // Dummy Candlestick & Indicator Drawing
            let candles = 30;
            let candWidth = canvas.width / candles;
            let price = canvas.height / 2;

            ctx.font = '12px Arial';
            ctx.fillStyle = '#00E676';
            ctx.fillText("NSE: NIFTY 50 | 15m | 9/15 EMA Active", 15, 25);

            for(let i = 0; i < candles; i++) {
                let x = i * candWidth + candWidth / 2;
                let h = Math.sin(i * 0.4) * 50;
                let open = price + h;
                let close = open + (Math.random() - 0.5) * 30;
                let high = Math.min(open, close) - 15 - Math.random() * 20;
                let low = Math.max(open, close) + 15 + Math.random() * 20;

                let isGreen = close <= open; // Canvas coordinates are inverted vertically
                ctx.strokeStyle = isGreen ? '#00E676' : '#FF1744';
                ctx.fillStyle = isGreen ? '#00E676' : '#FF1744';
                ctx.lineWidth = 2;

                // Wick
                ctx.beginPath();
                ctx.moveTo(x, high);
                ctx.lineTo(x, low);
                ctx.stroke();

                // Body
                ctx.fillRect(x - candWidth/3, Math.min(open, close), candWidth/1.5, Math.abs(close - open) || 2);
            }
        }

        // Initial load
        setTimeout(resizeCanvas, 100);
    </script>
</body>
</html>
