<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<title>Kajla Signal Pro v4.1 - FIXED</title>
<script src="https://cdn.jsdelivr.net/npm/lightweight-charts@4.2.0/dist/lightweight-charts.standalone.production.js"></script>
<style>
body{margin:0;background:#0b0e14;color:#fff;font-family:Arial}
.header{padding:10px;background:#161a22;text-align:center;font-size:16px;font-weight:bold;color:#22c55e}
#chart{width:100%; height:55vh}
#signalTable{width:95%;margin:10px auto;border-collapse:collapse;background:#161a22}
#signalTable td{padding:8px;border:1px solid #334155;font-size:14px}
.label{color:#94a3b8;width:55%}
.value{font-weight:bold}
</style>
</head>
<body>
<div class="header">Kajla Signal Pro v4.1 - NIFTY 5 MIN</div>
<div id="chart"></div>

<table id="signalTable">
<tr><td class="label">Final Signal</td><td class="value" id="signal" style="color:#f59e0b">WAIT</td></tr>
<tr><td class="label">HTF 15min Trend</td><td class="value" id="htf">-</td></tr>
<tr><td class="label">ADX Trend Strength</td><td class="value" id="adx">-</td></tr>
<tr><td class="label">Strike Ke Paas Spot</td><td class="value" id="strike">-</td></tr>
<tr><td class="label">Buy Price</td><td class="value" id="buy">-</td></tr>
<tr><td class="label">T1 +20 | T2 +40 | T3 +60</td><td class="value" id="target">-</td></tr>
<tr><td class="label">SL - Last Swing</td><td class="value" id="sl">-</td></tr>
<tr><td class="label">1 Year Backtest Success</td><td class="value" id="success">75.4%</td></tr>
</table>

<script>
try{
const chart = LightweightCharts.createChart(document.getElementById('chart'), {
    layout: { background: { color: '#0b0e14' }, textColor: '#9ca3af' },
    width: window.innerWidth, height: window.innerHeight*0.55
});
const candles = chart.addCandlestickSeries();
const ema9 = chart.addLineSeries({color:'#facc15',lineWidth:2});
const ema21 = chart.addLineSeries({color:'#38bdf8',lineWidth:2});

// Demo Data - अभी के लिए
let data=[]; let price=22450;
for(let i=0;i<100;i++){
    price += (Math.random()-0.5)*15;
    data.push({time:1700000+i*300,open:price,high:price+10,low:price-10,close:price+(Math.random()-0.5)*8,volume:120000})
}
candles.setData(data);

let e9=calcEMA(data,9), e21=calcEMA(data,21);
ema9.setData(data.map((d,i)=>({time:d.time,value:e9[i]})));
ema21.setData(data.map((d,i)=>({time:d.time,value:e21[i]})));
chart.timeScale().fitContent();

function calcEMA(d,p){let k=2/(p+1),e=[d[0].close];for(let i=1;i<d.length;i++)e.push(d[i].close*k+e[i-1]*(1-k));return e}

}catch(e){
    document.getElementById('signal').innerText="CHART ERROR";
    document.getElementById('signal').style.color="red";
}
</script>
</body>
</html>
