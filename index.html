<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kajla1990 Terminal - Market Scanner</title>
    <!-- Lightweight Charts Library -->
    <script src="https://unpkg.com/lightweight-charts/dist/lightweight-charts.standalone.production.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }
        .header {
            background-color: #181A21;
            padding: 12px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #333;
        }
        .header-title {
            color: #2979FF;
            font-weight: bold;
            font-size: 16px;
        }
        .header-balance {
            color: #00E676;
            font-size: 14px;
        }
        .chart-container {
            flex: 1;
            width: 100%;
            position: relative;
        }
        .footer {
            background-color: #181A21;
            padding: 10px;
            display: flex;
            justify-content: space-around;
            border-top: 1px solid #333;
        }
        .footer-item {
            color: #888;
            font-size: 12px;
            text-align: center;
        }
        .footer-item.active {
            color: #2979FF;
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="header-title">kajla1990 🇮🇳 Terminal</div>
        <div class="header-balance">Demo: ₹4,98,000</div>
    </div>

    <div id="chart" class="chart-container"></div>

    <div class="footer">
        <div class="footer-item active">Chart & Ind</div>
        <div class="footer-item">Strategy</div>
        <div class="footer-item">Paper Trade</div>
        <div class="footer-item">Portfolio</div>
    </div>

    <script>
        // सुरक्षित तरीके से चार्ट इनिशियलाइज़ करना
        const chartDom = document.getElementById('chart');
        
        const chart = LightweightCharts.createChart(chartDom, {
            width: chartDom.clientWidth,
            height: chartDom.clientHeight,
            layout: {
                backgroundColor: '#121212',
                textColor: '#d1d4dc',
            },
            grid: {
                vertLines: { color: '#2b2b43' },
                horzLines: { color: '#2b2b43' },
            },
            timeScale: {
                timeVisible: true,
            },
        });

        // कैंडल्स की सीरीज जोड़ना
        const candlestickSeries = chart.addCandlestickSeries({
            upColor: '#00E676',
            downColor: '#FF1744',
            borderVisible: false,
            wickUpColor: '#00E676',
            wickDownColor: '#FF1744',
        });

        // डमी डेटा जनरेट करके चार्ट पर डालना ताकि सफेद स्क्रीन न आए
        function loadDefaultData() {
            let data = [];
            let time = Math.floor(Date.now() / 1000) - (50 * 900); // 15 मिनट पीछे से
            let price = 24315;

            for (let i = 0; i < 50; i++) {
                let change = (Math.random() - 0.48) * 40;
                let open = price;
                let close = open + change;
                let high = Math.max(open, close) + Math.random() * 20;
                let low = Math.min(open, close) - Math.random() * 20;
                
                data.push({
                    time: time + (i * 900),
                    open: parseFloat(open.toFixed(2)),
                    high: parseFloat(high.toFixed(2)),
                    low: parseFloat(low.toFixed(2)),
                    close: parseFloat(close.toFixed(2))
                });
                price = close;
            }
            candlestickSeries.setData(data);
        }

        loadDefaultData();

        // स्क्रीन साइज बदलने पर चार्ट को ऑटो-एडजस्ट करना
        window.addEventListener('resize', () => {
            chart.resize(chartDom.clientWidth, chartDom.clientHeight);
        });
    </script>

</body>
</html>
