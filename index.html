<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>KSP v5.1 - Multi Market</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body { font-family: -apple-system, 'Segoe UI'; background: #0d1117; color: #c9d1d9; padding: 10px; }
    .header { background: linear-gradient(90deg, #238636, #1f6feb); padding: 15px; border-radius: 12px; text-align: center; margin-bottom: 10px; box-shadow: 0 4px 12px rgba(35,134,54,0.3); }
    .header h2 { font-size: 18px; color: white; font-weight: 700; }
    .time { font-size: 12px; color: #ffffffcc; margin-top: 4px; }
    .card { background: #161b22; border: 1px solid #30363d; border-radius: 10px; padding: 14px; margin: 10px 0; }
    .card-title { font-size: 13px; color: #8b949e; margin-bottom: 8px; font-weight: 600; }
    .btn { width: 100%; background: #238636; color: white; border: none; padding: 15px; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.2s; }
    .btn:active { background: #2ea043; transform: scale(0.98); }
    .buy { color: #3fb950; font-size: 20px; font-weight: bold; }
    .sell { color: #f85149; font-size: 20px; font-weight: bold; }
    .wait { color: #d29922; font-size: 18px; font-weight: bold; }
    select { width: 100%; padding: 12px; background: #0d1117; color: white; border: 1px solid #30363d; border-radius: 6px; font-size: 15px; }
    #output { font-size: 15px; line-height: 1.9; min-height: 120px; }
    .footer { text-align: center; font-size: 11px; color: #484f58; margin-top: 15px; }
</style>
</head>
<body>

<div class="header">
    <h2>🔥 KSP v5.1 - Multi Market</h2>
    <div class="time" id="liveTime"></div>
</div>

<div class="card">
    <div class="card-title">1. MARKET SELECT करो</div>
    <select id="market" onchange="changeMarket()">
        <option value="nifty">NIFTY 50 - India</option>
        <option value="banknifty">BANKNIFTY - India</option>
        <option value="forex">EURUSD - Forex</option>
        <option value="gold">GOLD XAUUSD - Forex</option>
        <option value="crypto">BTCUSD - Crypto 24x7</option>
    </select>
    
    <div class="card-title" style="margin-top:12px;">2. TIMEFRAME</div>
    <select id="tf">
        <option>5min</option>
        <option>15min</option>
    </select>
    
    <button class="btn" onclick="checkSignal()" style="margin-top:15px;">🚨 SIGNAL CHECK करो</button>
</div>

<div class="card">
    <div class="card-title">3. LIVE SIGNAL</div>
    <div id="output">⏳ Button दबाओ या 1.5 sec wait करो...</div>
</div>

<div class="footer">KSP v5.1 | Auto Check: 1.5 Second | Made for Mobile</div>
