<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kajla Terminal Pro</title>
<script src="https://unpkg.com/lightweight-charts@4.2.0/dist/lightweight-charts.standalone.production.js"></script>
<style>
  body{margin:0;background:#0b0e14;color:#fff;font-family:Arial}
 .header{display:flex;justify-content:space-between;padding:10px;background:#161a22;font-size:14px}
  #chart{width:100%; height:400px}
 .card{background:#161a22;margin:10px;padding:10px;border-radius:8px}
 .btn-buy{background:#22c55e;border:none;padding:10px 20px;border-radius:5px;color:#000;font-weight:bold;margin:5px}
 .btn-sell{background:#ef4444;border:none;padding:10px 20px;border-radius:5px;color:#fff;font-weight:bold;margin:5px}
  table{width:100%;border-collapse:collapse}
  td,th{padding:8px;text-align:left}
</style>
</head>
<body>
<div class="header">
  <b>kajla1990 🇮🇳 Terminal</b>
  <div style="color:#22c55e">Demo: ₹4,98,000</div>
</div>

<div id="chart"></div>

<div class="card">
  <h3>Signal: <span id="signal" style="color:orange">CHECKING...</span></h3>
  <button class="btn-buy" onclick="placeOrder('BUY')">BUY</button>
  <button class="btn-sell" onclick="placeOrder('SELL')">SELL</button>
</div>

<div class="card">
  <h3>📊 My Holdings</h3>
  <table>
    <tr><th>Stock</th><th>Qty</th><th>P&L</th></tr>
    <tr><td>NIFTY</td><td>5 Lot</td><td style="color:#22c55e">+₹2500</td></tr>
  </table>
</div>

<script>
function calculateEMA(data, period) {
    const k = 2 / (period + 1);
    let ema = data[0];
    let emaArray = [];
    for (let i = 0; i < data.length; i++) {
        ema = data[i] * k + ema * (1 - k);
        if(i >= period - 1) emaArray.push(ema);
    }
    return emaArray;
}

function placeOrder(type){
  const price = 24363.81;
  alert(`${type} Order Placed!\nQty: 1 Lot NIFTY\nPrice: ${price}\nStatus: Demo Order`);
}

window.onload = function() {
    const chart = LightweightCharts.createChart(document.getElementById('chart'), {
        layout: { background: { color: '#0b0e14' }, textColor: '#DDD' },
        grid: { vertLines: { color: '#1f2937' }, horzLines: { color: '#1f2937' } },
    });

    const candleSeries = chart.addCandlestickSeries({ upColor: '#22c55e', downColor: '#ef4444' });
    const volumeSeries = chart.addHistogramSeries({ color: '#26a69a', priceFormat: {type: 'volume'} });
    const ema9Series = chart.addLineSeries({ color: '#FFD700', lineWidth: 2, title: 'EMA 9' });
    const ema15Series = chart.addLineSeries({ color: '#00BFFF', lineWidth: 2, title: 'EMA 15' });

    function generateData() {
        const data = []; let price = 24300;
        for(let i = 0; i < 100; i++){
            price += (Math.random() - 0.5) * 30;
            data.push({
                time: Math.floor(Date.now()/1000) - (100-i)*15*60,
                open: price, high: price + 20, low: price - 20, close: price,
                volume: Math.random() * 100000
            })
        }
        return data;
    }

    const candleData = generateData();
    candleSeries.setData(candleData);
    volumeSeries.setData(candleData.map(d=>({time:d.time, value:d.volume, color:d.close>d.open?'#26a69a':'#ef5350'})));

    const closes = candleData.map(c => c.close);
    const ema9 = calculateEMA(closes, 9);
    const ema15 = calculateEMA(closes, 15);
    
    ema9Series.setData(ema9.map((val, i) => ({ time: candleData[i+8].time, value: val })));
    ema15Series.setData(ema15.map((val, i) => ({ time: candleData[i+14].time, value: val })));
    
    // Signal Check
    const last9 = ema9[ema9.length-1];
    const last15 = ema15[ema15.length-1];
    if(last9 > last15){
      document.getElementById('signal').innerText = "BUY SIGNAL";
      document.getElementById('signal').style.color = "#22c55e";
    } else {
      document.getElementById('signal').innerText = "SELL SIGNAL";
      document.getElementById('signal').style.color = "#ef4444";
    }
    
    chart.timeScale().fitContent();
}
</script>
</body>
</html>
