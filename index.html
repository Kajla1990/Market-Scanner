<!-- पुराने कोड की जगह यह नया और अधिक मजबूत कोड उपयोग करें -->

<script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
<script type="text/javascript">
    // सुनिश्चित करें कि यह HTML एलिमेंट मौजूद है और उसका आईडी 'tradingview_widget_container' है
    if (document.getElementById('tradingview_widget_container')) {
        new TradingView.widget({
            "autosize": true,
            // 'symbol' को सही करें। 'NSE:NIFTY50' के बजाय try करें:
            "symbol": "NSE:NIFTY", 
            "interval": "15", // आपका 15 मिनट का टाइमफ्रेम
            "timezone": "Asia/Kolkata", // भारतीय टाइमजोन
            "theme": "dark", // आपका डार्क थीम
            "style": "1",
            "locale": "en",
            "toolbar_bg": "#181A21", // थोड़ा बेहतर डार्क टूलबार
            "enable_publishing": false,
            // यह सबसे महत्वपूर्ण हिस्सा है - कस्टम इंडिकेटर को जोड़ना
            "studies": [
                // उदाहरण: 9 EMA जोड़ना
                {
                    "id": "MASimple@tv-basicstudies",
                    "inputs": {
                        "length": 9,
                        "source": "close"
                    }
                },
                // उदाहरण: 15 EMA जोड़ना
                {
                    "id": "MASimple@tv-basicstudies",
                    "inputs": {
                        "length": 15,
                        "source": "close"
                    }
                },
                // यदि आपने अपना कस्टम इंडिकेटर (pine script) बनाया है और आपके पास उसका स्क्रिप्ट ID है:
                // {
                //    "id": "PUB;YOUR_CUSTOM_SCRIPT_ID_HERE@tv-basicstudies"
                // }
            ],
            "hide_side_toolbar": false,
            "allow_symbol_change": true,
            "container_id": "tradingview_widget_container" // सुनिश्चित करें कि यह DIV आईडी से मेल खाता है
        });
    } else {
        console.error("TradingView container not found!");
    }
</script>
