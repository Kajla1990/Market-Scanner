<div class="card">
  <h3>Signal: <span id="signal" style="color:orange">WAIT</span></h3>
  <button onclick="placeOrder('BUY')">BUY</button>
  <button style="background:#ef4444" onclick="placeOrder('SELL')">SELL</button>
</div>

<div class="card">
  <h3>📊 My Holdings</h3>
  <table>
    <tr><th>Stock</th><th>Qty</th><th>P&L</th></tr>
    <tr><td>NIFTY</td><td>5 Lot</td><td style="color:#22c55e">+₹2500</td></tr>
  </table>
</div>

<script>
function placeOrder(type){
  alert(type + " Order Placed!\nQty: 1 Lot NIFTY\nPrice: 24363.81\nStatus: Demo Order");
}

// Auto Signal Check
function checkSignal(){
  const ema9 = 24375.27; // आप यहां last EMA value डालना
  const ema15 = 24371.14;
  if(ema9 > ema15){
    document.getElementById('signal').innerText = "BUY SIGNAL";
    document.getElementById('signal').style.color = "#22c55e";
  } else {
    document.getElementById('signal').innerText = "SELL SIGNAL";
    document.getElementById('signal').style.color = "#ef4444";
  }
}
checkSignal();
</script>
