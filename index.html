<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KSP v5.1 - 88% Sniper AUTO</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white p-4">
<div class="max-w-md mx-auto">
<h1 class="text-2xl font-bold text-center mb-4 text-green-400">KSP v5.1 - Auto Sniper</h1>

<select id="symbol" class="w-full p-2 mb-3 bg-gray-800 rounded border-gray-700">
  <option value="XAU/USD">XAUUSD - Gold</option>
  <option value="EUR/USD">EURUSD - Forex</option>
  <option value="BINANCE:BTCUSDT">BTCUSD - Crypto Binance</option>
</select>

<div class="flex gap-2 mb-3">
  <button id="alertBtn" onclick="toggleAlert()" class="w-1/2 bg-red-600 hover:bg-red-700 p-3 rounded font-bold">ALERT OFF</button>
  <button onclick="getSignal()" class="w-1/2 bg-blue-600 hover:bg-blue-700 p-3 rounded font-bold">MANUAL CHECK</button>
</div>

<div id="result" class="p-4 bg-gray-800 rounded border-gray-700">
  <p>Price: <span id="price" class="font-bold text-xl">-</span></p>
  <p>Signal: <span id="signal" class="font-bold text-xl">WAIT</span></p>
  <p>Confluence: <span id="score">0/3</span></p>
  <p>Status: <span id="status" class="text-yellow-400">Waiting...</span></p>
  <p id="error" class="text-red-400 text-sm mt-2"></p>
</div>
<p class="text-xs text-gray-400 mt-2">*Auto check हर 45 sec में होगा। 800 API/day limit सेफ</p>
</div>

<audio id="alertSound" src="https://actions.google.com/sounds/v1/alarms/beep_short.ogg"></audio>

<script>
const TWELVEDATA_KEY = "e4c120ce37d14c328408d381ee4c5c06";
let lastSignal = "WAIT";
let lastPrice = 0;
let alertInterval = null;
let alertOn = false;

// KSP v5.1 Logic - 3 Point Confluence
function calcKSP(price) {
  let score = 0;
  if(lastPrice > 0) {
    if(price > lastPrice) score++; // Trend Up
    if(price > lastPrice * 1.003) score++; // Momentum 0.3%
    if(price > lastPrice * 1.005) score++; // Strong 0.5%
    if(price < lastPrice * 0.997) score = 0; // SELL
  }
  
  let signal = "WAIT";
  if(score >= 2) signal = "BUY";
  else if(score == 0 && lastPrice > 0) signal = "SELL";
  
  if(signal != lastSignal && score == 1) signal = lastSignal; // Weak change ignore
  
  lastPrice = price;
  return {signal, score};
}

async function getData(symbol) {
  let url = `https://api.twelvedata.com/price?symbol=${symbol}&apikey=${TWELVEDATA_KEY}`;
  const res = await fetch(url);
  const data = await res.json();
  if(data.code) throw new Error(data.message);
  return parseFloat(data.price);
}

async function checkSignal() {
  try {
    document.getElementById('error').innerText = "";
    const symbol = document.getElementById('symbol').value;
    const price = await getData(symbol);
    document.getElementById('price').innerText = price.toFixed(2);
    
    const ksp = calcKSP(price);
    document.getElementById('score').innerText = ksp.score + "/3";
    
    // Signal Alert - Sirf tab bajao jab signal change ho
    if(ksp.signal != lastSignal && ksp.signal != "WAIT") {
      document.getElementById('alertSound').play();
      alert("🔥 KSP v5.1 SIGNAL 🔥\n\n" + ksp.signal + "\nPrice: " + price.toFixed(2) + "\nConfluence: " + ksp.score + "/3");
      document.getElementById('status').innerText = "SIGNAL MILA! " + ksp.signal;
      document.getElementById('status').className = "text-green-400 font-bold";
    } else {
      document.getElementById('status').innerText = "Monitoring...";
      document.getElementById('status').className = "text-yellow-400";
    }
    
    lastSignal = ksp.signal;
    document.getElementById('signal').innerText = ksp.signal;
    document.getElementById('signal').className = ksp.signal=="BUY" ? "text-green-400 font-bold text-xl" : ksp.signal=="SELL" ? "text-red-400 font-bold text-xl" : "text-yellow-400 font-bold text-xl";
    
  } catch(e) {
    document.getElementById('error').innerText = "Error: " + e.message;
  }
}

function getSignal() {
  checkSignal(); // Manual
}

function toggleAlert() {
  const btn = document.getElementById('alertBtn');
  if(alertOn) {
    clearInterval(alertInterval);
    alertOn = false;
    btn.innerText = "ALERT OFF";
    btn.className = "w-1/2 bg-red-600 hover:bg-red-700 p-3 rounded font-bold";
    document.getElementById('status').innerText = "Stopped";
  } else {
    alertOn = true;
    btn.innerText = "ALERT ON";
    btn.className = "w-1/2 bg-green-600 hover:bg-green-700 p-3 rounded font-bold";
    document.getElementById('status').innerText = "Monitoring...";
    checkSignal(); // Turant check
    alertInterval = setInterval(checkSignal, 45000); // 45 sec
  }
}
</script>
</body>
</html>
