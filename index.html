<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kajla Terminal Pro</title>
<script src="https://cdn.jsdelivr.net/npm/lightweight-charts@4.2.0/dist/lightweight-charts.standalone.production.js?v=4"></script>
<style>
body{margin:0;background:#0b0e14;color:#fff;font-family:Arial}
.header{display:flex;justify-content:space-between;padding:10px;background:#161a22}
.watchlist{display:flex;gap:10px;padding:10px;overflow-x:auto}
.watchlist button{background:#1f2937;border:1px solid #374151;color:#fff;padding:8px 15px;border-radius:5px}
.watchlist button.active{background:#2563eb}
#chart{width:100%; height:400px}
.card{background:#161a22;margin:10px;padding:12px;border-radius:8px}
.btn-buy{background:#22c55e;border:none;padding:10px 25px;border-radius:5px;color:#000;font-weight:bold}
.btn-sell{background:#ef4444;border:none;padding:10px 25px;border-radius:5px;color:#fff;font-weight:bold}
</style>
</head>
<body>
<div class="header"><b>kajla1990 🇮🇳 Terminal</b><div id="balance" style="color:#22c55e">Demo: ₹4,98,000</div></div>
<div class="watchlist">
<button class="active" onclick="loadData('NIFTY', this)">NIFTY</button>
<button onclick="loadData('BANKNIFTY', this)">BANKNIFTY</button>
<button onclick="loadData('RELIANCE', this)">RELIANCE</button>
</div>
<div id="chart"></div>
<div class="card"><h3>Signal: <span id="signal">LOADING...</span></h3>
<button class="btn-buy" onclick="alert('BUY Clicked')">BUY</button>
<button class="btn-sell" onclick="alert('SELL Clicked')">SELL</button></div>

<script>
let chart, candleSeries;
function loadData(symbol, btn){
document.querySelectorAll('.watchlist button').forEach(b=>b.classList.remove('active'));
btn.classList.add('active');
initChart();
}
function initChart(){
document.getElementById('chart').innerHTML='';
chart = LightweightCharts.createChart(document.getElementById('chart'), {layout: {background: {color: '#0b0e14'}, textColor: '#DDD'}});
candleSeries = chart.addCandlestickSeries({upColor: '#22c55e', downColor: '#ef4444'});
let data=[]; let price=24300;
for(let i=0; i<100; i++){price += (Math.random()-0.5)*30; data.push({time: Math.floor(Date.now()/1000)-(100-i)*900, open:price, high:price+20, low:price-20, close:price});}
candleSeries.setData(data);
document.getElementById('signal').innerText = "BUY SIGNAL";
document.getElementById('signal').style.color = "#22c55e";
chart.timeScale().fitContent();
}
window.onload = initChart;
</script>
</body>
</html>
