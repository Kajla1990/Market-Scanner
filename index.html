<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kajla Terminal Pro</title>
<script src="https://unpkg.com/lightweight-charts@4.2.0/dist/lightweight-charts.standalone.production.js"></script>
<style>
body{margin:0;background:#0b0e14;color:#fff;font-family:Arial}
.header{padding:10px;background:#161a22}
#chart{width:100%; height:450px}
</style>
</head>
<body>
<div class="header"><b>kajla1990 🇮🇳 Terminal - NIFTY</b></div>
<div id="chart"></div>

<script>
const chart = LightweightCharts.createChart(document.getElementById('chart'), {
    layout: { background: { color: '#0b0e14' }, textColor: '#DDD' }, // काला background
    grid: { vertLines: { color: '#1f2937' }, horzLines: { color: '#1f2937' } },
    width: document.getElementById('chart').clientWidth,
    height: 450
});

const candleSeries = chart.addCandlestickSeries({
    upColor: '#26a69a', // Kotak हरा
    downColor: '#ef5350', // Kotak लाल
    borderDownColor: '#ef5350',
    borderUpColor: '#26a69a',
    wickDownColor: '#ef5350',
    wickUpColor: '#26a69a'
});

// 100 candle का demo data
let data = [];
let price = 24300;
for(let i=0; i<100; i++){
    price += (Math.random() - 0.5) * 50;
    data.push({
        time: Math.floor(Date.now()/1000) - (100-i)*15*60, // 15min candle
        open: price, high: price+30, low: price-30, close: price
    })
}
candleSeries.setData(data);
chart.timeScale().fitContent();
</script>
</body>
</html>
