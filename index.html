<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KSP v5.1 - 88% Sniper</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white p-4">
<div class="max-w-md mx-auto">
<h1 class="text-2xl font-bold text-center mb-4">KSP v5.1 - 88% Sniper</h1>

<select id="symbol" class="w-full p-2 mb-2 bg-gray-800 rounded">
  <option value="XAU/USD">XAUUSD - Gold</option>
  <option value="EUR/USD">EURUSD - Forex</option>
  <option value="BTC/USD">BTCUSD - Crypto</option>
</select>

<button onclick="getSignal()" class="w-full bg-green-600 p-3 rounded font-bold">SIGNAL CHECK करो</button>

<div id="result" class="mt-4 p-4 bg-gray-800 rounded">
  <p>Price: <span id="price">-</span></p>
  <p>Signal: <span id="signal">WAIT</span></p>
  <p id="error" class="text-red-400 text-sm"></p>
</div>
</div>

<script>
const TWELVEDATA_KEY = "e4c120ce37d14c328408d381ee4c5c06"; // Sirf ye wali key use hogi

async function getData(symbol) {
  document.getElementById('error').innerText = "";
  // TwelveData Time Series 1 candle
  let url = `https://api.twelvedata.com/price?symbol=${symbol}&apikey=${TWELVEDATA_KEY}`;
  
  const res = await fetch(url);
  const data = await res.json();
  if(data.code) throw new Error(data.message);
  return data.price;
}

async function getSignal() {
  try {
    const symbol = document.getElementById('symbol').value;
    const price = await getData(symbol);
    document.getElementById('price').innerText = parseFloat(price).toFixed(2);
    
    // Demo signal for now
    let signal = Math.random() > 0.5 ? "BUY" : "SELL";
    document.getElementById('signal').innerText = signal;
    
  } catch(e) {
    document.getElementById('error').innerText = "Error: "+e.message;
    document.getElementById('price').innerText = "Error";
  }
}
</script>
</body>
</html>
