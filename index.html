<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kajla Terminal Pro</title>
<script src="https://cdn.jsdelivr.net/npm/lightweight-charts@4.2.0/dist/lightweight-charts.standalone.production.js?v=7"></script>
<style>
body{margin:0;background:#0b0e14;color:#fff;font-family:Arial}

.watchlist{display:flex;gap:10px;padding:10px;overflow-x:auto}
.watchlist button{background:#1f2937;border:1px solid #374151;color:#fff;padding:8px 15px;border-radius:5px;cursor:pointer}
.watchlist button.active{background:#2563eb;border-color:#2563eb}
.chartType{display:flex;gap:10px;padding:0 10px 10px 10px}
.chartType button{background:#374151;border:none;color:#fff;padding:6px 12px;border-radius:5px;cursor:pointer}
.chartType button.active{background:#f59e0b;color:#000}
#chart{width:100%; height:420px}
.card{background:#161a22;margin:10px;padding:12px;border-radius:8px}
.btn-buy{background:#22c55e;border:none;padding:10px 25px;border-radius:5px;color:#000;font-weight:bold}
.btn-sell{background:#ef4444;border:none;padding:10px 25px;border-radius:5px;color:#fff;font-weight:bold}
</style>
</head>
<body>
<div class="header">

  <div>NIFTY: <span id="ltp" style="color:#22c55e">24,366.70 +0.27%</span></div>
</div>

<div class="watchlist">
<button class="active" onclick="changeStock('NIFTY', this)">NIFTY</button>
<button onclick="changeStock('BANKNIFTY', this)">BANKNIFTY</button>
<button onclick="changeStock('RELIANCE', this)">RELIANCE</button>
</div>

<div class="chartType">
<button class="active" onclick="changeChart('Candlestick', this)">Candlestick</button>
<button onclick="changeChart('HeikinAshi', this)">Heikin Ashi</button>
<button onclick="changeChart('Line', this)">Line</button>
</div>

<div id="chart"></div>

<div class="card">
<h3>Signal: <span id="signal" style="color:#ef4444">SELL SIGNAL</span></h3>
<button class="btn-buy">BUY</button>
<button class="btn-sell">SELL</button>
</div>

<script>
let chart, candleSeries, volumeSeries;
let currentType = 'Candlestick';
let rawData = [];

function generateData(){
  rawData = [];
  let price = 24300;
  for(let i = 0; i < 100; i++){
      price += (Math.random() - 0.4) * 40;
      rawData.push({
          time: Math.floor(Date.now()/1000) - (100-i)*15*60,
          open: price, high: price + 25, low: price - 25, close: price,
          volume: Math.random() * 100000
      })
  }
}

function toHeikinAshi(data){
    let haData = [];
    for(let i=0; i<data.length; i++){
        let o = i===0? (data[i].open + data[i].close)/2 : (haData[i-1].open + haData[i-1].close)/2;
        let c = (data[i].open + data[i].high + data[i].low + data[i].close)/4;
        let h = Math.max(data[i].high, o, c);
        let l = Math.min(data[i].low, o, c);
        haData.push({time:data[i].time, open:o, high:h, low:l, close:c});
    }
    return haData;
}

    timeScale: { borderColor: '#374151' }
  });

    upColor: '#26a69a', // हरा - Kotak जैसा

    borderUpColor: '#26a69a',
    wickDownColor: '#ef5350',
    wickUpColor: '#26a69a'
  });

  chart.priceScale('volume').applyOptions({ scaleMargins: { top: 0.8, bottom: 0 } });
