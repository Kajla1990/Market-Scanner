<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<title>Kajla Signal Pro - 5 MIN</title>
<script src="https://unpkg.com/lightweight-charts@4.2.0/dist/lightweight-charts.standalone.production.js"></script>
<style>
body{margin:0;background:#0b0e14;color:#fff;font-family:Arial}
.header{padding:10px;background:#161a22;text-align:center;font-size:16px;font-weight:bold}
#chart{width:100%; height:75vh}
#signalBox{padding:15px;background:#161a22;font-size:24px;font-weight:bold;text-align:center;border-top:3px solid}
</style>
</head>
<body>
<div class="header">Kajla Signal Pro - NIFTY 5 MIN</div>
<div id="chart"></div>
<div id="signalBox">WAIT</div>

<script>
const chart = LightweightCharts.createChart(document.getElementById('chart'), {
    layout: { background: { color: '#0b0e14' }, textColor: '#9ca3af' },
    width: window.innerWidth, height: window.innerHeight - 100
});

const candleSeries = chart.addCandlestickSeries();
const ema9Series = chart.addLineSeries({ color: '#facc15', lineWidth: 2 }); // पीली
const ema21Series = chart.addLineSeries({ color: '#38bdf8', lineWidth: 2 }); // नीली

// 5 Min का डेटा - 30 दिन का ~ 2000 candle
let rawData = [];
let price = 22600;
let startTime = Math.floor(Date.now()/1000) - 30*24*60*60; // 30 दिन पहले

for(let i=0; i<2000; i++){
    price += (Math.random() - 0.5) * 20; // 5 min में छोटा मूव
    let o = price; let c = price + (Math.random() - 0.5) * 15;
    let h = Math.max(o,c) + Math.random()*8; let l = Math.min(o,c) - Math.random()*8;
    rawData.push({time: startTime + i*5*60, open: o, high: h, low: l, close: c})
}
candleSeries.setData(rawData);

// EMA + Signal
function calculateEMA(data, period){
    let k = 2 / (period + 1); let ema = [data[0].close];
    for(let i=1; i<data.length; i++){ ema.push(data[i].close * k + ema[i-1] * (1-k)); }
    return ema;
}

let ema9 = calculateEMA(rawData, 9);
let ema21 = calculateEMA(rawData, 21);

ema9Series.setData(rawData.map((d,i)=>({time:d.time, value:ema9[i]})));
ema21Series.setData(rawData.map((d,i)=>({time:d.time, value:ema21[i]})));

let last = rawData.length-1;
let signalText = "WAIT"; let signalColor = "#f59e0b";
if(ema9[last] > ema21[last]){ signalText = "BUY SIGNAL"; signalColor = "#22c55e"; }
if(ema9[last] < ema21[last]){ signalText = "SELL SIGNAL"; signalColor = "#ef4444"; }

document.getElementById('signalBox').innerText = signalText;
document.getElementById('signalBox').style.color = signalColor;
document.getElementById('signalBox').style.borderTopColor = signalColor;

chart.timeScale().fitContent();
</script>
</body>
</html>
