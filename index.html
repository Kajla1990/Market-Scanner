<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pro Trading Terminal</title>
    <style>
        body {
            margin: 0;
            background-color: #121212;
            color: #ffffff;
            font-family: Arial, sans-serif;
            overflow: hidden;
        }
        header {
            background: #1e1e1e;
            padding: 12px;
            text-align: center;
            font-size: 18px;
            font-weight: bold;
            border-bottom: 1px solid #333;
        }
        .tradingview-widget-container {
            height: calc(100vh - 120px);
            width: 100%;
        }
        .bottom-nav {
            position: fixed;
            bottom: 0;
            width: 100%;
            height: 55px;
            background: #1e1e1e;
            display: flex;
            justify-content: space-around;
            align-items: center;
            border-top: 1px solid #333;
            z-index: 1000;
        }
        .nav-item {
            color: #888;
            text-align: center;
            font-size: 11px;
            cursor: pointer;
        }
        .nav-item.active {
            color: #2962ff;
        }
    </style>
</head>
<body>

    <header>🚀 Pro Trading Terminal</header>

    <!-- TradingView Advanced Real-time Chart Widget BEGIN -->
    <div class="tradingview-widget-container">
        <div class="tradingview-widget-container__widget" style="height:100%;width:100%"></div>
        <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-advanced-chart.js" async>
        {
          "width": "100%",
          "height": "100%",
          "symbol": "NSE:RELIANCE",
          "interval": "15",
          "timezone": "Asia/Kolkata",
          "theme": "dark",
          "style": "1",
          "locale": "en",
          "enable_publishing": false,
          "allow_symbol_change": true,
          "calendar": false,
          "support_host": "https://www.tradingview.com"
        }
        </script>
    </div>
    <!-- TradingView Widget END -->

    <!-- Bottom Navigation Bar -->
    <div class="bottom-nav">
        <div class="nav-item active">🏠 Home</div>
        <div class="nav-item">📈 Watchlist</div>
        <div class="nav-item">📋 Orders</div>
        <div class="nav-item">💼 Portfolio</div>
    </div>

</body>
</html>
