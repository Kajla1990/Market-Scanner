<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KSP v5.1 - 88% Sniper</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white p-4">
<div class="max-w-md mx-auto">
<h1 class="text-2xl font-bold text-center mb-4">KSP v5.1 - 88% Sniper</h1>

<select id="symbol" class="w-full p-2 mb-2 bg-gray-800 rounded">
  <option value="NSE:NIFTY 50">NIFTY 50 - India</option>
  <option value="NSE:BANKNIFTY">BANKNIFTY - India</option>
  <option value="BINANCE:BTCUSD">BTCUSD - Crypto</option>
  <option value="FX:XAUUSD">XAUUSD - Gold</option>
  <option value="FX:EURUSD">EURUSD - Forex</option>
</select>

<button onclick="getSignal()" class="w-full bg-green-600 p-3 rounded font-bold">SIGNAL CHECK करो</button>

<div id="result" class="mt-4 p-4 bg-gray-800 rounded">
  <p>Price: <span id="price">-</span></p>
  <p>Signal: <span id="signal">WAIT</span></p>
  <p id="error" class="text-red-400 text-sm"></p>
</div>
</div>

<script>
const FINNHUB_KEY = "d9mn5k9r01qtdq8ujijgd9nr"; 
const TWELVEDATA_KEY = "e4c120ce37d14c328408d381ee4c5c06";

async function getData(symbol) {
  document.getElementById('error').innerText = "";
  let url = "";
  
  if(symbol.startsWith("NSE:") || symbol.startsWith("BINANCE:")) {
    url = `https://finnhub.io/api/v1/quote?symbol=${symbol}&token=${FINNHUB_KEY}`;
    const res = await fetch(url);
    const data = await res.json();
    if(!data.c) throw new Error("Finnhub: "+JSON.stringify(data));
    return data.c;
  } else {
    url = `https://api.twelvedata.com/price?symbol=${symbol}&apikey=${TWELVEDATA_KEY}`;
    const res = await fetch(url);
    const data = await res.json();
    if(data.code) throw new Error("TwelveData: "+data.message);
    return data.price;
  }
}

async function getSignal() {
  try {
    const symbol = document.getElementById('symbol').value;
    const price = await getData(symbol);
    document.getElementById('price').innerText = parseFloat(price).toFixed(2);
    
    // Abhi demo signal - Random
    let signal = Math.random() > 0.5 ? "BUY" : "SELL";
    document.getElementById('signal').innerText = signal;
    
  } catch(e) {
    document.getElementById('error').innerText = "Error: "+e.message;
    document.getElementById('price').innerText = "Error";
  }
}
</script>
</body>
</html>
