<!DOCTYPE html>
<html>
<head>
<title>Kajla Terminal</title>
<script src="https://unpkg.com/lightweight-charts@4.2.0/dist/lightweight-charts.standalone.production.js"></script>
<style>body{background:#000;color:#fff}#chart{height:400px}</style>
</head>
<body>
<h3>kajla1990 Terminal - NIFTY</h3>
<div id="chart"></div>
<script>
const chart = LightweightCharts.createChart(document.getElementById('chart'), {layout:{bg:'#000',text:'#fff'}});
const candle = chart.addCandlestickSeries({upColor:'#26a69a',downColor:'#ef5350'});
candle.setData([
{time:'2026-01-01',open:24300,high:24400,low:24250,close:24350},
{time:'2026-01-02',open:24350,high:24500,low:24300,close:24450},
{time:'2026-01-03',open:24450,high:24550,low:24400,close:24500}
]);
</script>
</body>
</html>
