<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Kajla Terminal - Fixed</title>
<script src="https://unpkg.com/lightweight-charts/dist/lightweight-charts.standalone.production.js"></script>
<script src="https://cdn.jsdelivr.net/npm/technicalindicators@3.1.0/dist/browser.js"></script>
<style>
  body { margin:0; background:#0e1117; color:#fff; font-family:sans-serif; }
  #chart { width:100%; height:90vh; }
  .header { padding:10px; background:#161a22; font-size:14px; color:#4ade80; }
</style>
</head>
<body>
<div class="header">kajla1990 Terminal | NSE: NIFTY 50 | 15m | 9/15 EMA Active | Demo: ₹4,98,000</div>
<div id="chart"></div>

<script>
const chart = LightweightCharts.createChart(document.getElementById('chart'), {
    layout: { background: { color: '#0e1117' }, textColor: '#DDD' },
    grid: { vertLines: { color: '#222' }, horzLines: { color: '#222' } },
    timeScale: { timeVisible: true },
});

const candleSeries = chart.addCandlestickSeries();
const ema9Series = chart.addLineSeries({ color: '#FFD700', lineWidth: 2, title: 'EMA 9' });
const ema15Series = chart.addLineSeries({ color: '#00BFFF', lineWidth: 2, title: 'EMA 15' });

// --- IMPORTANT: Yaha apna data API daalo ---
// Abhi demo data hai. Isko apne scanner ke /api/data se replace karna
function getDemoData() {
    const data = [];
    let price = 24500;
    for(let i = 0; i < 200; i++){
        price += (Math.random() - 0.5) * 50;
        data.push({
            time: new Date(Date.now() - (200-i)*15*60*1000).getTime()/1000,
            open: price,
            high: price + 20,
            low: price - 20,
            close: price + (Math.random() - 0.5) * 10
        })
    }
    return data;
}

function updateChart() {
    const candleData = getDemoData(); // <-- yaha fetch('/api/candles') lagao
    
    candleSeries.setData(candleData);
    
    const closes = candleData.map(c => c.close);
    
    // EMA 9
    const ema9 = technicalindicators.EMA.calculate({period: 9, values: closes});
    const ema9Data = ema9.map((val, i) => ({ time: candleData[i+8].time, value: val }));
    ema9Series.setData(ema9Data);
    
    // EMA 15
    const ema15 = technicalindicators.EMA.calculate({period: 15, values: closes});
    const ema15Data = ema15.map((val, i) => ({ time: candleData[i+14].time, value: val }));
    ema15Series.setData(ema15Data);
    
    chart.timeScale().fitContent();
}

// Pehli baar chalao + har 15 sec me update karo
updateChart();
setInterval(updateChart, 15000); 
</script>
</body>
</html>
